#
# Nginx reverse proxy for Hefaistos
# - Proxies SPA frontend to the `frontend` service
# - Proxies API/GraphQL to the `backend` service

# Redirect HTTP to HTTPS on 8443
server {
    listen 8080;
    server_name localhost _;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name localhost _;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/hefaistos.crt;
    ssl_certificate_key /etc/nginx/certs/hefaistos.key;

    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Trust X-Forwarded-For from Docker networks (covers all standard Docker bridge/overlay ranges)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Allow up to 10MB file uploads (AdvOps strAIn & Media)
    client_max_body_size 10M;

    # Common proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- ATT&CK Navigator local config/data from shared volume ---
    location = /navigator/assets/config.json {
        alias /navigator-data/config.json;
        error_page 403 404 = @navigator_config_static;
    }

    location = /navigator/data/index.json {
        alias /navigator-data/data/index.json;
        error_page 403 404 = @navigator_index_static;
    }

    location /navigator/data/ {
        alias /navigator-data/data/;
    }

    location @navigator_config_static {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @navigator_index_static {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FRONTEND (Main App) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    # --- BACKEND API (GraphQL) ---
    # GraphQL is protected by JWT authentication, no IP restriction needed
    location /graphql {
        # Allow larger request bodies for base64-encoded file uploads (strAIn document analysis)
        # Base64 encoding increases file size by ~33%, so 10MB file becomes ~13MB
        # Adding overhead for JSON structure, set limit to 20MB
        client_max_body_size 20M;
        
        proxy_pass http://backend:8000/graphql;
        proxy_http_version 1.1;
        # Explicitly set all required proxy headers (child location blocks do NOT
        # inherit proxy_set_header from the parent server block in nginx)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $host;
        
        # Extended timeouts for long-running operations (AI processing)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Coverage Layer JSON for ATT&CK Navigator ---
    # CORS is handled by Django (django-cors-headers + CORSPrivateNetworkMiddleware)
    # Do NOT add CORS headers here — duplicates cause browsers to reject the response.
    location /api/coverage/ {
        proxy_pass http://backend:8000/api/coverage/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # --- GraphiQL static assets (served by Django) ---
    # CRA also serves /static/*; narrowly route Graphene's assets to backend
    location /static/graphene_django/ {
        proxy_pass http://backend:8000/static/graphene_django/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # --- BACKEND API (Django Admin) - PRIVATE NETWORKS ONLY ---
    # Restrict admin panel to localhost and Docker internal networks.
    # To grant access from additional IPs, add them in front of nginx via a
    # firewall rule or an upstream proxy; do NOT add individual IPs here.
    location /admin {
        # Allow private networks only
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 185.91.166.204;
        deny all;
        
        proxy_pass http://backend:8000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Django Admin static files - PRIVATE NETWORKS ONLY ---
    # Ensure admin CSS/JS is served from backend, not frontend SPA
    location /static/admin/ {
        # Allow private networks only
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 185.91.166.204;
        deny all;
        
        proxy_pass http://backend:8000/static/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # --- User-uploaded media (snapshots, avatars) ---
    # Serve directly from the shared media volume for better performance
    location /media/ {
        alias /var/www/media/;
        expires 1h;
        add_header Cache-Control "public";
        # Security: do not execute scripts in the media directory
        add_header X-Content-Type-Options nosniff;

        # CORS headers for cross-origin requests
        # Allow all origins for media files (read-only public resources)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Note: Do NOT proxy `/static/` to backend; CRA serves frontend assets under `/static/*`.
    # Django admin static will be available under `/admin/static/*` through the `/admin` proxy.

}
