    name: analyst_user
    organisation: SecOps Team

tvm_ref: tvm_t1003_001

objective:
  type: Threat
  priority: Critical
  composition: composite
  description: Detect LSASS memory access for credential dumping
  threats: []
  signals:
    - id: sig-001
      name: LSASS Process Access
      data_source: Windows Security Events
      event_id: 4663
      description: Object access to lsass.exe process

    - id: sig-002
      name: Sysmon Process Access
      data_source: Sysmon
      event_id: 10
      description: Process accessed LSASS with suspicious permissions

false_positives: |
  - Legitimate security tools (EDR agents, backup software)
  - Windows Update and system maintenance
  - Authorized penetration testing

triage_guidance: |
  1. Check if source process is signed and trusted
  2. Review process command line and parent process
  3. Correlate with network connections to C2 infrastructure
  4. Check for presence of known credential dumping tools

response:
  severity: Critical incident
  alert_trigger: Any process accessing LSASS memory with read permissions
  playbook: |
    **Immediate Actions:**
    1. Isolate affected endpoint from network
    2. Capture memory dump for forensic analysis
    3. Reset credentials for affected accounts

    **Investigation:**
    4. Identify source process and determine legitimacy
    5. Search for IOCs across environment
    6. Review authentication logs for compromised credentials

    **Containment:**
    7. Block identified malicious hashes/processes
    8. Monitor for lateral movement attempts
    9. Escalate to Incident Response team

validation:
  robustness_level: 4
  data_source_maturity: Kernel-Mode

tags:
  - credential-access
  - lsass
  - memory-dumping
  - t1003
