description: Credential Dumping via LSASS Memory Access

mitre:
  technique_id: T1003.001
  technique_name: LSASS Memory
  tactic: Credential Access

technical_context: |
  Adversaries dump credentials from LSASS process memory using tools
  like Mimikatz, ProcDump, or Comsvcs.dll. Requires SeDebugPrivilege.

blind_spots: |
  - Memory-only attacks without disk artifacts
  - Living-off-the-land binaries (LOLBins) access
  - Kernel-mode rootkits

triage_guidance: |
  1. Verify process has SeDebugPrivilege
  2. Check parent process legitimacy
  3. Correlate with suspicious network activity
  4. Review authentication logs for credential misuse

threat:
  att&ck:
    - T1003.001
  terrain: Endpoint (Windows workstations and servers)
  leverage:
    - SeDebugPrivilege access
    - LSASS process handle
    - Memory reading capabilities
  impact:
    - Domain credential compromise
    - Lateral movement enablement
    - Privilege escalation
  viability: High - common post-exploitation technique
  description: |
    Attackers with local admin rights use credential dumping tools
    to extract plaintext passwords, NTLM hashes, and Kerberos tickets
    from LSASS memory for lateral movement.
