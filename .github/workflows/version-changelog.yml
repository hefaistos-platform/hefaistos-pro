name: Generate Version Changelog

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag to document (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog file
        id: changelog
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail

          git fetch origin --tags
          git fetch origin sharp --no-tags
          git checkout -B sharp origin/sharp

          version="${TAG_NAME#v}"
          scripts/versioning.sh validate "${version}" >/dev/null

          mkdir -p Versions
          output_file="Versions/${version}.md"

          if [[ -f "${output_file}" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "output_file=${output_file}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          previous_tag="$(git tag --list 'v*' --sort=-version:refname | awk -v current="${TAG_NAME}" '$0 != current { print; exit }')"

          if [[ -n "${previous_tag}" ]]; then
            commit_range="${previous_tag}..${TAG_NAME}"
          else
            commit_range="${TAG_NAME}"
          fi

          scripts/generate-version-changelog.sh \
            --version "${version}" \
            --range "${commit_range}" \
            --output "${output_file}"

          echo "exists=false" >> "${GITHUB_OUTPUT}"
          echo "output_file=${output_file}" >> "${GITHUB_OUTPUT}"

      - name: Commit changelog
        if: steps.changelog.outputs.exists == 'false'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.changelog.outputs.output_file }}"
          git commit -m "docs(versions): add changelog file for ${TAG_NAME} [skip version bump] [skip ci]"
          git push origin sharp
